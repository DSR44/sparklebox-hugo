{{- with .Params.faqs }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $faq := . }}
    {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $faq.q | plainify | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $faq.a | plainify | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
{{- end }}
