<!-- Sparklebox Slide-In Subscription Pop-up -->
<div id="subscribe-popup" style="
    position: fixed;
    bottom: 80px;
    right: 20px;
    background: linear-gradient(135deg, #1a0a2e 0%, #0f0520 100%);
    border: 1px solid rgba(192,132,252,0.3);
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    z-index: 9998;
    transform: translateX(400px);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
    <button id="close-popup" style="
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        border: none;
        color: #64748b;
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
        transition: color 0.2s;
    ">&times;</button>
    
    <h3 style="font-family: 'Cinzel', serif; font-size: 1.1rem; background: linear-gradient(135deg, #c084fc 0%, #ec4899 50%, #f9a8d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0 0 8px 0;">Join the Sanctuary</h3>
    <p style="color: #94a3b8; font-size: 0.85rem; margin: 0 0 16px 0; line-height: 1.4;">Whispers of wonder delivered to your inbox. No noise.</p>
    
    <form id="popup-subscribe-form">
        <input type="email" id="popup-email" placeholder="your@email.com" required
               style="width: 100%; padding: 12px; border: 1px solid rgba(192,132,252,0.3); border-radius: 8px; background: rgba(15,5,30,0.8); color: #f1f5f9; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; outline: none;">
        <button type="submit" style="
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        ">Subscribe</button>
    </form>
    <p style="color: #64748b; font-size: 0.65rem; margin: 10px 0 0 0; text-align: center;">Unsubscribe anytime.</p>
</div>

<style>
#popup-email:focus { border-color: #c084fc !important; }
#close-popup:hover { color: #f1f5f9 !important; }
</style>

<script>
(function() {
    const popup = document.getElementById('subscribe-popup');
    const closeBtn = document.getElementById('close-popup');
    
    // Show popup after 30 seconds or 50% scroll
    let shown = false;
    const showPopup = () => {
        if (shown) return;
        if (sessionStorage.getItem('popup-closed')) return;
        shown = true;
        setTimeout(() => {
            popup.style.opacity = '1';
            popup.style.transform = 'translateX(0)';
        }, 100);
    };
    
    // 30 second delay
    setTimeout(showPopup, 30000);
    
    // 50% scroll
    window.addEventListener('scroll', () => {
        const scrollPct = window.scrollY / (document.body.scrollHeight - window.innerHeight);
        if (scrollPct > 0.5) showPopup();
    });
    
    // Close
    closeBtn.addEventListener('click', () => {
        popup.style.transform = 'translateX(400px)';
        sessionStorage.setItem('popup-closed', 'true');
    });
    
    // Submit
    document.getElementById('popup-subscribe-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('popup-email').value;
        const btn = this.querySelector('button');
        btn.textContent = '...';
        btn.disabled = true;
        
        try {
            const res = await fetch('/api/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (res.ok) {
                btn.textContent = 'Welcome!';
                setTimeout(() => { popup.style.transform = 'translateX(400px)'; }, 2000);
            } else {
                btn.textContent = 'Try again';
                btn.disabled = false;
            }
        } catch {
            btn.textContent = 'Try again';
            btn.disabled = false;
        }
    });
})();
</script>
