{{ $slug := .Page.File.ContentBaseName }}
<div class="obs-feed" data-slug="{{ $slug }}">

  <div class="obs-header">
    <span class="obs-icon">🌿</span>
    <h3 class="obs-title">What did you notice today?</h3>
    <p class="obs-subtitle">A space for human perception — no likes, no algorithm, just what you saw.</p>
  </div>

  <form class="obs-form" onsubmit="return SparkleObs.submit(event)">
    <input type="text" class="obs-name-input" placeholder="Your name (optional)" maxlength="50" />
    <textarea class="obs-body-input" placeholder="What did you notice?" maxlength="2000" rows="3" required></textarea>
    <div class="obs-form-footer">
      <span class="obs-char-count">0 / 2000</span>
      <button type="submit" class="obs-submit-btn">Share Observation</button>
    </div>
  </form>

  <div class="obs-divider"></div>

  <div class="obs-list" id="obs-list">
    <div class="obs-loading">Loading observations...</div>
  </div>

  <button class="obs-load-more" id="obs-load-more" style="display:none" onclick="SparkleObs.loadMore()">
    Load more observations
  </button>
</div>

<script>
(function() {
  const API = '/api';
  const feed = document.querySelector('.obs-feed');
  const slug = feed.dataset.slug;
  const list = document.getElementById('obs-list');
  const moreBtn = document.getElementById('obs-load-more');
  let page = 0;
  let total = 0;
  let loaded = 0;

  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderObservation(obs) {
    const el = document.createElement('div');
    el.className = 'obs-item';
    el.dataset.id = obs.id;
    el.innerHTML =
      '<div class="obs-meta">' +
        '<span class="obs-author">🌿 ' + esc(obs.display_name) + '</span>' +
        '<span class="obs-time">' + timeAgo(obs.created_at) + '</span>' +
      '</div>' +
      '<div class="obs-body">"' + esc(obs.body) + '"</div>' +
      '<div class="obs-responses" id="resp-' + obs.id + '"></div>' +
      '<button class="obs-reply-toggle" onclick="SparkleObs.toggleReply(\'' + obs.id + '\')">' +
        '↳ Respond' +
      '</button>' +
      '<div class="obs-reply-form" id="reply-form-' + obs.id + '" style="display:none">' +
        '<input type="text" placeholder="Your name (optional)" maxlength="50" class="obs-reply-name" />' +
        '<textarea placeholder="Your response..." maxlength="1000" rows="2" class="obs-reply-body" required></textarea>' +
        '<button class="obs-reply-btn" onclick="SparkleObs.submitReply(\'' + obs.id + '\')">Send</button>' +
      '</div>';
    return el;
  }

  async function loadObservations() {
    try {
      const res = await fetch(API + '/observations?slug=' + encodeURIComponent(slug) + '&page=' + page);
      const data = await res.json();
      total = data.total || 0;

      if (page === 0) {
        list.innerHTML = '';
        if (total === 0) {
          list.innerHTML = '<div class="obs-empty">No observations yet. Be the first to notice something.</div>';
          moreBtn.style.display = 'none';
          return;
        }
      }

      (data.observations || []).forEach(function(obs) {
        list.appendChild(renderObservation(obs));
        loaded++;
        loadResponses(obs.id);
      });

      moreBtn.style.display = loaded < total ? 'block' : 'none';
    } catch (e) {
      if (page === 0) list.innerHTML = '<div class="obs-empty">Could not load observations.</div>';
    }
  }

  async function loadResponses(obsId) {
    try {
      const res = await fetch(API + '/responses?observation_id=' + obsId);
      const data = await res.json();
      const container = document.getElementById('resp-' + obsId);
      if (!container || !data.responses || data.responses.length === 0) return;

      container.innerHTML = data.responses.map(function(r) {
        return '<div class="obs-response">' +
          '<span class="obs-response-author">↳ ' + esc(r.display_name) + '</span>' +
          '<span class="obs-time">' + timeAgo(r.created_at) + '</span>' +
          '<div class="obs-response-body">"' + esc(r.body) + '"</div>' +
        '</div>';
      }).join('');
    } catch (e) {}
  }

  window.SparkleObs = {
    submit: async function(e) {
      e.preventDefault();
      const form = feed.querySelector('.obs-form');
      const nameInput = form.querySelector('.obs-name-input');
      const bodyInput = form.querySelector('.obs-body-input');
      const btn = form.querySelector('.obs-submit-btn');
      const body = bodyInput.value.trim();
      if (!body) return false;

      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const res = await fetch(API + '/observations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slug: slug,
            display_name: nameInput.value.trim() || 'Anonymous Observer',
            body: body
          })
        });
        if (res.ok) {
          const obs = await res.json();
          const empty = list.querySelector('.obs-empty');
          if (empty) empty.remove();
          list.insertBefore(renderObservation(obs), list.firstChild);
          loaded++;
          total++;
          nameInput.value = '';
          bodyInput.value = '';
          feed.querySelector('.obs-char-count').textContent = '0 / 2000';
        }
      } catch (e) {}
      btn.disabled = false;
      btn.textContent = 'Share Observation';
      return false;
    },

    toggleReply: function(obsId) {
      var form = document.getElementById('reply-form-' + obsId);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    },

    submitReply: async function(obsId) {
      var form = document.getElementById('reply-form-' + obsId);
      var nameInput = form.querySelector('.obs-reply-name');
      var bodyInput = form.querySelector('.obs-reply-body');
      var btn = form.querySelector('.obs-reply-btn');
      var body = bodyInput.value.trim();
      if (!body) return;

      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        var res = await fetch(API + '/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            observation_id: obsId,
            display_name: nameInput.value.trim() || 'Anonymous Observer',
            body: body
          })
        });
        if (res.ok) {
          nameInput.value = '';
          bodyInput.value = '';
          form.style.display = 'none';
          loadResponses(obsId);
        }
      } catch (e) {}
      btn.disabled = false;
      btn.textContent = 'Send';
    },

    loadMore: function() {
      page++;
      loadObservations();
    }
  };

  // Character counter
  var textarea = feed.querySelector('.obs-body-input');
  var counter = feed.querySelector('.obs-char-count');
  textarea.addEventListener('input', function() {
    counter.textContent = this.value.length + ' / 2000';
  });

  // Initial load
  loadObservations();
})();
</script>
