<!-- Sparklebox Email Subscription -->
<div class="sb-subscribe">
  <div class="sb-subscribe__neon-bar" aria-hidden="true"></div>
  <span class="sb-subscribe__eyebrow">Stay in the signal</span>
  <h3 class="sb-subscribe__title">Join the Sanctuary</h3>
  <p class="sb-subscribe__text">Transmissions from Elle Vida — perception, frequency, and the upgrade path. No noise.</p>

  <form id="subscribe-form" class="sb-subscribe__form">
    <input type="email" id="email" name="email" class="sb-subscribe__input" placeholder="your@email.com" required>
    <button type="submit" id="subscribe-btn" class="sb-subscribe__btn">Subscribe</button>
  </form>

  <p id="subscribe-message" class="sb-subscribe__message" hidden></p>
  <p class="sb-subscribe__fine">By subscribing, you agree to receive email updates. Unsubscribe anytime.</p>
</div>

<script>
document.getElementById('subscribe-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const msg = document.getElementById('subscribe-message');
  const btn = document.getElementById('subscribe-btn');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const response = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await response.json();
    if (data.status === 'subscribed' || data.id) {
      msg.textContent = 'Welcome to the sanctuary. Check your inbox.';
      msg.className = 'sb-subscribe__message sb-subscribe__message--ok';
      msg.hidden = false;
      this.reset();
    } else {
      msg.textContent = 'Something went wrong. Try again.';
      msg.className = 'sb-subscribe__message sb-subscribe__message--err';
      msg.hidden = false;
    }
  } catch {
    msg.textContent = 'Something went wrong. Try again.';
    msg.className = 'sb-subscribe__message sb-subscribe__message--err';
    msg.hidden = false;
  }
  btn.disabled = false;
  btn.textContent = 'Subscribe';
});
</script>
