# PaperMod Theme Settings
[params]
  homeTitle = "Sparklebox | Consciousness & Perception Architecture — Elle Vida"
  description = "Sparklebox by Elle Vida: The Path — The Map and The Reset. Consciousness architecture, cognitive frequency, perception is creation. Not generic wellness."
  author = "Elle Vida"
  env = "production"
  hreflang = "en"
  keywords = ["perception architecture", "consciousness", "the path sparklebox", "frequency upgrade", "adaptation protocol", "mental alchemy", "perceptive creation", "Elle Vida", "Sparklebox", "cognitive frequency"]
  disableThemeToggle = true

  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://www.sparklebox.blog/",
      "https://sparkleboxblog.gumroad.com",
      "https://www.instagram.com/sparklebox_by_elle_vida_/",
      "https://www.pinterest.com/blingsp444/",
      "https://www.youtube.com/@dreamweavertales_sparklebox",
      "https://huggingface.co/spaces/FutureHAi/thedrift",
      "https://constellationcompiler.art/"
    ]

  [params.ogImage]
    width = 1200
    height = 630

  images = ["/images/sparklebox-og.png"]
  
  # PaperMod specific settings
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  
  # CRITICAL: Don't show posts list on homepage
  mainSections = []
  
  # Profile Mode for Homepage
  [params.profileMode]
    enabled = false
    title = "Sparklebox"
    subtitle = "Consciousness & perception architecture — where perception becomes creation."
    imageUrl = ""
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Sparklebox"
  
  # Disable Home Info Mode - we use custom _index.md instead
  [params.homeInfoParams]
    Title = ""
    Content = ""

  # Cover image settings
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true
    linkFullImages = true

  # Search functionality
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    noClasses = false
    style = "monokai"

# Privacy settings
[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true
