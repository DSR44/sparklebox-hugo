baseURL = "https://sparklebox.blog/"
languageCode = "en-us"
title = "Sparklebox"
theme = "PaperMod"

[pagination]
  pagerSize = 10

# Enable JSON feed only (RSS disabled)
[outputs]
  home = ["HTML", "JSON"]

# Permalinks
[permalinks]
  posts = "/posts/:year/:month/:slug/"
  pages = "/:slug/"

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Menu — Main bar (1–5) + dropdown (6+)
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Musebox"
    url = "/musebox-dreams/"
    weight = 2

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    name = "Frequency Upgrade"
    url = "/frequency-upgrade/"
    weight = 4

  [[menu.main]]
    name = "Bazaar"
    url = "/the-sparkle-bazaar/"
    weight = 5

  # Tools & more (dropdown)
  [[menu.main]]
    name = "The Drift & Oracle"
    url = "https://huggingface.co/spaces/FutureHAi/thedrift"
    weight = 6

  [[menu.main]]
    name = "Constellation Compiler"
    url = "https://constellationcompiler.art/"
    weight = 7

  [[menu.main]]
    name = "Dream Portals"
    url = "/the-dreamtoolkit/"
    weight = 8

  [[menu.main]]
    name = "Tarot"
    url = "https://sparklebox-tarot.streamlit.app/"
    weight = 9

  [[menu.main]]
    name = "Ancient Wisdom"
    url = "/categories/mystical-wisdom-series/"
    weight = 10

  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 11

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 12

# PaperMod Theme Settings
[params]
  description = "✨ Sparklebox | Your portal to daily soft power, inner healing, and cosmic becoming."
  author = "Elle Vida"
  disableThemeToggle = true
  
  # PaperMod specific settings
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  
  # CRITICAL: Don't show posts list on homepage
  mainSections = []
  
  # Profile Mode for Homepage
  [params.profileMode]
    enabled = false
    title = "Sparklebox ✨"
    subtitle = "Your portal to daily soft power, inner healing, and cosmic becoming."
    imageUrl = ""
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Sparklebox"
  
  # Disable Home Info Mode - we use custom _index.md instead
  [params.homeInfoParams]
    Title = ""
    Content = ""

  # Cover image settings
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true
    linkFullImages = true

  # Search functionality
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    noClasses = false
    style = "monokai"

# Privacy settings
[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true
