<!-- Sparklebox slide-in subscription popup -->
<div id="subscribe-popup" class="sb-popup" aria-live="polite">
  <div class="sb-popup__neon-bar" aria-hidden="true"></div>
  <button type="button" id="close-popup" class="sb-popup__close" aria-label="Close">&times;</button>
  <span class="sb-popup__eyebrow">Sparklebox</span>
  <h3 class="sb-popup__title">Join the Sanctuary</h3>
  <p class="sb-popup__text">Transmissions on perception & frequency. No noise.</p>
  <form id="popup-subscribe-form" class="sb-popup__form">
    <input type="email" id="popup-email" class="sb-popup__input" placeholder="your@email.com" required>
    <button type="submit" class="sb-popup__btn">Subscribe</button>
  </form>
  <p class="sb-popup__fine">Unsubscribe anytime.</p>
</div>

<script>
(function() {
  const popup = document.getElementById('subscribe-popup');
  const closeBtn = document.getElementById('close-popup');
  let shown = false;

  const showPopup = () => {
    if (shown || sessionStorage.getItem('popup-closed')) return;
    shown = true;
    popup.classList.add('sb-popup--visible');
  };

  setTimeout(showPopup, 30000);
  window.addEventListener('scroll', () => {
    const scrollPct = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    if (scrollPct > 0.5) showPopup();
  });

  closeBtn.addEventListener('click', () => {
    popup.classList.remove('sb-popup--visible');
    sessionStorage.setItem('popup-closed', 'true');
  });

  document.getElementById('popup-subscribe-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('popup-email').value;
    const btn = this.querySelector('button');
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (res.ok) {
        btn.textContent = 'Welcome!';
        setTimeout(() => popup.classList.remove('sb-popup--visible'), 2000);
      } else {
        btn.textContent = 'Try again';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = 'Try again';
      btn.disabled = false;
    }
  });
})();
</script>
