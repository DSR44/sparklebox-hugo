<!-- Sparklebox Email Subscription -->
{{ partial "subscribe_form.html" . }}

<!-- Sparklebox Slide-In Popup -->
{{ partial "subscribe_popup.html" . }}

<!-- signup-in-post -->
<script>
(function () {
  if (document.getElementById("subscribe-form-inline")) return;
  if (!/\/posts\/.+/.test(location.pathname)) return;
  var content = document.querySelector(".post-content");
  var form = document.getElementById("subscribe-form");
  if (!content || !form) return;
  var box = form.closest(".sb-subscribe") || form.parentElement;
  if (!box || content.contains(box)) return;
  var clone = box.cloneNode(true);
  clone.setAttribute("data-signup-inline", "1");
  clone.querySelectorAll("[id]").forEach(function (el) { el.id = el.id + "-inline"; });
  var h2 = content.querySelector("h2");
  if (h2) h2.insertAdjacentElement("afterend", clone);
  else content.insertBefore(clone, content.firstChild);
  var inline = document.getElementById("subscribe-form-inline");
  if (!inline) return;
  inline.addEventListener("submit", async function (e) {
    e.preventDefault();
    var emailEl = inline.querySelector('input[type="email"]');
    var btn = inline.querySelector("button");
    var msg = document.getElementById("subscribe-message-inline");
    if (!emailEl || !btn) return;
    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = "Subscribing...";
    try {
      var response = await fetch("/api/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailEl.value,
          page: location.origin + location.pathname
        })
      });
      var data = await response.json();
      if (msg) {
        msg.style.display = "block";
        msg.hidden = false;
        if (response.ok && !data.error) {
          msg.textContent = "You are in. Check your inbox.";
          msg.style.color = "#4ade80";
          inline.reset();
        } else {
          msg.textContent = "Something went wrong. Try again.";
          msg.style.color = "#f87171";
        }
      }
    } catch (err) {
      if (msg) {
        msg.style.display = "block";
        msg.hidden = false;
        msg.textContent = "Something went wrong. Try again.";
        msg.style.color = "#f87171";
      }
    }
    btn.disabled = false;
    btn.textContent = prev;
  });
})();
</script>
