baseURL = "https://www.sparklebox.blog/"
languageCode = "en-us"
title = "Sparklebox"
theme = "PaperMod"
copyright = "© Elle Vida · Sparklebox — Perception is Creation"

[pagination]
  pagerSize = 10

# Enable JSON feed + clean sitemap
[outputs]
  home = ["HTML", "JSON", "Sitemap"]
  section = ["HTML", "Sitemap"]
  page = ["HTML", "Sitemap"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

# Permalinks
[permalinks]
  posts = "/posts/:year/:month/:slug/"
  pages = "/:slug/"

# Taxonomies — categories only (tags removed to eliminate 400+ tag archive pages)
[taxonomies]
  category = "categories"

# Menu — Main bar (1–5) + dropdown (6+)
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

