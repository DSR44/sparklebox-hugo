<!-- Sparklebox Email Subscription Form -->
<div style="background: linear-gradient(135deg, rgba(139,92,246,0.1) 0%, rgba(236,72,153,0.1) 100%); border: 1px solid rgba(192,132,252,0.2); border-radius: 16px; padding: 40px 32px; margin: 40px auto; text-align: center; max-width: 500px;">
    <h3 style="font-family: 'Cinzel', serif; font-size: 1.3rem; background: linear-gradient(135deg, #c084fc 0%, #ec4899 50%, #f9a8d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;">Join the Sanctuary</h3>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5;">Whispers of wonder delivered to your inbox. No noise. Just magic.</p>
    
    <form id="subscribe-form" style="display: flex; gap: 12px; max-width: 400px; margin: 0 auto; flex-wrap: wrap; justify-content: center;">
        <input type="email" id="email" name="email" placeholder="your@email.com" required
               style="flex: 1; min-width: 200px; padding: 14px 16px; border: 1px solid rgba(192,132,252,0.3); border-radius: 10px; background: rgba(15,5,30,0.8); color: #f1f5f9; font-size: 16px; outline: none; font-family: inherit; transition: border-color 0.3s;">
        <button type="submit" id="subscribe-btn"
                style="background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; font-family: inherit; transition: opacity 0.3s;">
            Subscribe
        </button>
    </form>
    
    <p id="subscribe-message" style="margin-top: 16px; font-size: 14px; display: none;"></p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 16px;">By subscribing, you agree to receive email updates. Unsubscribe anytime.</p>
</div>

<style>
#email:focus { border-color: #c084fc !important; }
#subscribe-btn:hover { opacity: 0.85; }
@media (max-width: 480px) {
    #subscribe-form { flex-direction: column; }
    #subscribe-form input, #subscribe-form button { width: 100%; }
}
</style>

<script>
document.getElementById('subscribe-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const msg = document.getElementById('subscribe-message');
    const btn = document.getElementById('subscribe-btn');
    
    btn.disabled = true;
    btn.textContent = '...';
    
    try {
        const response = await fetch('/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (data.status === 'subscribed' || data.id) {
            msg.textContent = 'Welcome to the sanctuary. Check your inbox.';
            msg.style.color = '#c084fc';
            msg.style.display = 'block';
            this.reset();
        } else {
            msg.textContent = 'Something went wrong. Try again.';
            msg.style.color = '#f87171';
            msg.style.display = 'block';
        }
    } catch (err) {
        msg.textContent = 'Something went wrong. Try again.';
        msg.style.color = '#f87171';
        msg.style.display = 'block';
    }
    
    btn.disabled = false;
    btn.textContent = 'Subscribe';
});
</script>
