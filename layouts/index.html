{{- define "main" }}
<div style="max-width: 900px !important; margin: 0 auto !important; padding: 2rem 1.5rem !important; width: 100% !important; display: block !important; position: relative !important;">
    {{ .Content }}
</div>

<!-- Latest Posts Grid (scoped to homepage only) -->
<div class="homepage-posts-grid" style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;">
        {{- range first 6 (where site.RegularPages "Type" "posts") }}
        <a href="{{ .RelPermalink }}" class="homepage-post-card" style="text-decoration: none;">
            {{- if .Params.cover.image }}
            <div style="width: 100%; height: 200px; overflow: hidden; border-radius: 12px 12px 0 0;">
                <img src="{{ .Params.cover.image }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            {{- end }}
            <div style="padding: 1.5rem;">
                <h3 style="font-family: 'Cinzel', serif; font-size: 1.1rem; margin-bottom: 0.5rem; color: #f1f5f9;">{{ .Title }}</h3>
                <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.6;">{{ .Summary | truncate 120 }}</p>
                <time style="color: #64748b; font-size: 0.85rem;">{{ .Date.Format "January 2, 2006" }}</time>
            </div>
        </a>
        {{- end }}
    </div>
</div>
{{- end }}
